<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beauty Routine Advisor</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="app-container">
      <!-- Левая панель -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo-placeholder"></div>
        </div>

        <nav class="sidebar-nav">
          <button class="nav-btn">Beauty</button>
          <button class="nav-btn">Routine</button>
          <button class="nav-btn">Advisor</button>
        </nav>

        <div class="sidebar-footer">
          <span class="app-name">Beauty routine advisor</span>
        </div>
      </aside>

      <!-- Основная область -->
      <main class="main-content">
        <div class="chat-wrapper">
          <!-- Заголовок чата -->
          <header class="chat-header">
            <h2 class="chat-title">Персональный чат</h2>
          </header>

          <!-- Область сообщений -->
          <div class="messages-container" id="messages"></div>

          <!-- Поле ввода -->
          <div class="input-container">
            <input
              type="text"
              id="user-input"
              class="input-field"
              placeholder="Опишите ваш тип кожи и проблемы..."
            />
            <button id="send-button" class="send-btn">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
              </svg>
            </button>
          </div>
        </div>
      </main>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
  </body>
</html>
